name: Tests and coverage

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  coverage:
    name: Coverage target (100% per source file)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce statements, branches, functions, and lines
        run: npm run test:coverage
      - name: List every remaining coverage gap
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: npm run test:coverage:report
      - name: Upload coverage report even if the target is not yet met
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
