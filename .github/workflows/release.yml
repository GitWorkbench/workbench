name: Build release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools libarchive-tools rpm xz-utils zstd

      - name: Verify tag matches app version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected_tag" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage, deb, rpm, and Pacman packages
        run: npm run dist:linux

      - name: Verify all Linux installers and updater metadata
        shell: bash
        run: node scripts/build-linux.cjs --verify-only

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: git-workbench-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/latest-linux.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches app version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected_tag" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run dist:win

      - name: Verify Windows updater metadata
        shell: bash
        run: test -s dist/latest.yml

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: git-workbench-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build unsigned universal macOS package
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches app version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected_tag" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build universal unsigned macOS DMG and ZIP
        run: npm run dist:mac -- --universal

      - name: Verify macOS updater metadata
        shell: bash
        run: test -s dist/latest-mac.yml

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: git-workbench-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  prepare-draft-release:
    name: Attach assets to a draft release
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform assets
        uses: actions/download-artifact@v7
        with:
          pattern: git-workbench-*
          path: release-assets
          merge-multiple: true

      - name: Verify release metadata before attaching assets
        shell: bash
        run: |
          test -s release-assets/latest-linux.yml
          test -s release-assets/latest.yml
          test -s release-assets/latest-mac.yml

      - name: Create draft release or refresh its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GH_REPO"
            exit 0
          fi

          release_options=(--draft --verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${release_options[@]}" release-assets/* --repo "$GH_REPO"
